# Activates the CityUHK portal chatbot as the `cityu-portal` LLM provider.
# The portal authenticates with a browser session cookie, which this plugin
# reads from the environment variable named by `cookieEnv` at request time.
- insert:
    - id: cityu-portal-llm
      name: '@local/cityu-portal-llm'
      config:
        cookieEnv: CITYU_PORTAL_COOKIE
        contextWindow: 32000
        requestTimeoutMs: 120000
